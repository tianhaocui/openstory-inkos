# Include inside the creation.dakalami.com HTTPS server block.
location = /_inkos_auth {
    internal;
    proxy_pass http://127.0.0.1:3001/api/internal/inkos-session;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-API-Key "";
    proxy_set_header X-Original-URI $request_uri;
}

location @inkos_login {
    return 302 /login?redirect=%2Finkos%2F;
}

location = /inkos {
    return 301 /inkos/;
}

location ^~ /inkos/ {
    auth_request /_inkos_auth;
    auth_request_set $inkos_user_id $upstream_http_x_openstory_user_id;
    auth_request_set $inkos_team_id $upstream_http_x_openstory_team_id;
    auth_request_set $inkos_team_role $upstream_http_x_openstory_team_role;
    error_page 401 = @inkos_login;

    proxy_pass http://127.0.0.1:4567/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-OpenStory-User-Id $inkos_user_id;
    proxy_set_header X-OpenStory-Team-Id $inkos_team_id;
    proxy_set_header X-OpenStory-Team-Role $inkos_team_role;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
